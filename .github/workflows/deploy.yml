name: Deploy (VPS)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd ${{ secrets.APP_DIR }}
            git fetch --all
            git reset --hard origin/main

            # Ensure env file exists on server
            if [ ! -f .env ]; then
              echo "Missing .env on server. Create /var/www/app/.env with POSTGRES_PASSWORD and SECRET_KEY_BASE."
              exit 1
            fi

            # Build and run
            docker compose pull || true
            docker compose up -d --build

            # Optional: cleanup old images
            docker image prune -f

            # Basic health check (retry for up to 2 minutes)
            for i in $(seq 1 24); do
              if curl -fsS http://127.0.0.1:3000 >/dev/null; then
                echo "Deploy OK"
                exit 0
              fi
              sleep 5
            done

            echo "Deploy failed: app did not become healthy in time"
            exit 1
